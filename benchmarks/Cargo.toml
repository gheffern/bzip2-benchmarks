[package]
name = "bzip2-benchmarks"
version = "0.1.0"
edition = "2021"

[dependencies]
libbz2-rs-sys = { path = "../libbzip2-rs/libbz2-rs-sys" }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
